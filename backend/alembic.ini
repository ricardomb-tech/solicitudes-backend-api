[alembic]
script_location = migrations
prepend_sys_path = .

# Nombre de archivo de migración con fecha delante, para que el orden
# cronológico sea evidente al listar el directorio.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# IMPORTANTE: "sqlalchemy.url" NO se define aquí a propósito.
# Este archivo se versiona en el repositorio; escribir aquí la cadena de
# conexión significaría commitear usuario y contraseña de la base de datos.
# La URL se inyecta en tiempo de ejecución desde la variable de entorno
# DATABASE_URL, dentro de migrations/env.py (ver ese archivo).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
