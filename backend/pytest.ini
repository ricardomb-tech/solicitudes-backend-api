[pytest]
testpaths = tests
; Antepone el directorio de trabajo (/app dentro del contenedor) a sys.path,
; para que "from app...." resuelva sin depender de que tests/ tenga __init__.py
; ni de configurar PYTHONPATH manualmente al invocar pytest.
pythonpath = .
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:/app/htmlcov
