# =============================================================================
# NOTA SOBRE VALORES POR DEFECTO (${VAR:-default}):
#
# Cada variable usada aquí tiene un valor por defecto IDÉNTICO al de
# .env.example. Esto es lo que permite que el comando exigido literalmente
# por el enunciado, "docker compose up --build", funcione en un clon recién
# descargado del repositorio, INCLUSO ANTES de crear un archivo .env — que
# es justamente el escenario en el que se ejecuta por primera vez.
#
# Si existe un .env real (recomendado para cualquier uso más allá de la
# evaluación inmediata: `cp .env.example .env` y ajustar), sus valores tienen
# prioridad sobre estos defaults, porque Compose sustituye ${VAR} usando el
# entorno del shell y el archivo .env de nivel de proyecto ANTES de aplicar
# el resultado a cada servicio.
#
# Los valores por defecto son credenciales de DESARROLLO ya públicas en
# .env.example (nunca secretos reales) — no contradice "credenciales fuera
# del código": en un despliegue real (AWS) estas vendrían de Secrets Manager
# y nunca de un valor por defecto en este archivo (ver docs/aws/PROPUESTA-AWS.md).
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: solicitudes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solicitudes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-solicitudes_db}
    volumes:
      # Volumen nombrado (gestionado por Docker) para persistencia real de
      # los datos de Postgres: sobrevive a "down" (sin -v) y a recreaciones
      # del contenedor. REQ-T-05 / REQ-D-05.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready es el comando oficial de Postgres para confirmar que el
      # servidor ya acepta conexiones (no solo que el proceso arrancó).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solicitudes_user} -d ${POSTGRES_DB:-solicitudes_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - solicitudes-net
    # Deliberadamente sin "ports": en este proyecto Postgres solo debe ser
    # alcanzable desde otros contenedores de la red interna de Compose,
    # coherente con la restricción de la propuesta AWS de que la base de
    # datos nunca se expone directamente. Para inspeccionar la BD con un
    # cliente SQL local, usar `docker compose exec db psql -U ... ` o un
    # docker-compose.override.yml no versionado que agregue el mapeo de puerto.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # IMPORTANTE: explícito a propósito. Docker construye por defecto el
      # ÚLTIMO stage del Dockerfile cuando no se indica "target" — y desde que
      # se agregaron los stages "test-deps"/"test" (ADR-0012), el último stage
      # dejó de ser "runtime". Sin esta línea, "docker compose up" construiría
      # y arrancaría la imagen de PRUEBAS en el servicio de producción.
      target: runtime
    container_name: solicitudes-backend
    restart: unless-stopped
    env_file:
      # required: false -> si no existe .env (clon recién descargado, sin
      # "cp .env.example .env" todavía), Compose NO aborta: usa los defaults
      # de "environment:" de abajo. Ver nota al inicio del archivo.
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-solicitudes-api}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://solicitudes_user:changeme_dev_password@db:5432/solicitudes_db}
    ports:
      # Solo localhost, no todas las interfaces: el backend es el punto de
      # entrada de esta solución LOCAL, pero no debe quedar alcanzable desde
      # otros equipos de la misma red (LAN/wifi compartida) sin que nadie lo
      # haya decidido explícitamente. En AWS este rol lo cumple el ALB, detrás
      # de HTTPS y WAF (ver docs/aws/PROPUESTA-AWS.md).
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        # "service_healthy" (no solo "service_started"): el backend espera a
        # que Postgres reporte healthy, no solo a que el contenedor arranque.
        # Sin esto, el backend fallaría su primera conexión en un arranque en
        # frío, porque Postgres tarda unos segundos en aceptar conexiones
        # después de que el contenedor inicia.
        condition: service_healthy
    volumes:
      # Persistencia de logs más allá del ciclo de vida del contenedor
      # (REQ-D-05), en paralelo a la salida por stdout que consume
      # `docker compose logs -f`.
      - backend-logs:/app/logs
    healthcheck:
      # Verifica /health/ready (no /health): el consumidor debe esperar a que
      # el backend pueda REALMENTE atender peticiones (BD incluida), no solo a
      # que el proceso de Uvicorn haya arrancado (ver ADR-0010 y ADR-0014).
      #
      # Se usa el módulo estándar de Python (urllib) en vez de instalar curl:
      # la imagen runtime no trae curl (ver ADR-0006, imagen mínima), y añadir
      # un paquete de sistema solo para el healthcheck sería exactamente el
      # tipo de dependencia innecesaria que ese ADR busca evitar. Python ya
      # está garantizado en la imagen porque es el runtime de la aplicación.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - solicitudes-net

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
      # Mismo motivo que en "backend": sin esto se construiría el último
      # stage del Dockerfile ("test"), no "runtime".
      target: runtime
    container_name: solicitudes-consumer
    # Proceso de UN SOLO LOTE, no un servicio de larga duración (ver
    # ADR-0014): se ejecuta, procesa su lote y termina. "no" evita que Compose
    # lo reinicie en bucle al terminar con código 0 (un reinicio automático
    # aquí simularía tráfico externo periódico, que está fuera del alcance de
    # esta prueba; para ejecutar otro lote basta con
    # `docker compose run --rm consumer`).
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      CONSUMER_NUM_REQUESTS: ${CONSUMER_NUM_REQUESTS:-10}
      CONSUMER_TIMEOUT_CONNECT_S: ${CONSUMER_TIMEOUT_CONNECT_S:-3}
      CONSUMER_TIMEOUT_READ_S: ${CONSUMER_TIMEOUT_READ_S:-10}
      CONSUMER_MAX_RETRIES: ${CONSUMER_MAX_RETRIES:-3}
      CONSUMER_BACKOFF_BASE_S: ${CONSUMER_BACKOFF_BASE_S:-0.5}
    depends_on:
      backend:
        # Espera a que el backend esté "ready" (BD incluida), no solo iniciado.
        condition: service_healthy
    volumes:
      - consumer-logs:/app/logs
    networks:
      - solicitudes-net

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Usa el stage "test" (ver ADR-0012): imagen con pytest/httpx incluidos,
      # que NUNCA es la que se despliega ni la que arranca con "docker compose
      # up" a secas.
      target: test
    container_name: solicitudes-backend-tests
    # "profiles: [test]" excluye este servicio de "docker compose up" por
    # defecto. Solo se ejecuta con:
    #   docker compose run --rm backend-tests
    # Así se cumple el requisito de que "docker compose up --build" levante
    # la solución (backend + BD + consumidor), sin que un contenedor de
    # pruebas (que termina su ejecución y no es un proceso de larga duración)
    # aparezca mezclado en "docker compose ps".
    profiles: ["test"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://solicitudes_user:changeme_dev_password@db:5432/solicitudes_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - solicitudes-net

  consumer-tests:
    build:
      context: ./consumer
      dockerfile: Dockerfile
      target: test
    container_name: solicitudes-consumer-tests
    profiles: ["test"]
    # Sin depends_on ni env_file de conexión a servicios reales: las pruebas
    # del consumidor verifican la política de reintentos con un transporte
    # HTTP simulado (ver consumer/tests/conftest.py) y no requieren que el
    # backend ni la base de datos estén corriendo.
    networks:
      - solicitudes-net

networks:
  solicitudes-net:
    driver: bridge

volumes:
  pgdata:
  backend-logs:
  consumer-logs:
